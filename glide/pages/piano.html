<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano</title>
<!--
  Piano: a falling-notes piano page that ships with Glide (GL-066). Open it with `/glide ui open piano`.

  Sound: a piano voice built in WebAudio by this file (a harmonic periodic wave, a filtered hammer noise and a
  small delay-network room). No samples or downloads. Songs are public-domain compositions in this file's own
  arrangement: Ode to Joy (Beethoven, 1824), Twinkle, Twinkle (the French air "Ah! vous dirai-je, maman", 1761),
  Für Elise, opening (Beethoven, c. 1810). This file is dedicated to the public domain (CC0 1.0).

  Theme: the Glide pane sets the --glide-* CSS variables and sends the `glide-theme` window event on every
  restyle (kvnloo/glide#326); the lane repaints in those colors.
-->
<style>
  :root {
    --bg: var(--glide-bg, #0e0c14); --surface: var(--glide-surface, #17141f); --fg: var(--glide-fg, #ece8f4);
    --muted: var(--glide-muted, #9a93ab); --accent: var(--glide-accent, #6ee7c8); --ink: var(--glide-accent-ink, #111111);
    --white-key: color-mix(in srgb, var(--fg) 92%, var(--accent)); --black-key: color-mix(in srgb, var(--bg) 88%, var(--fg));
    color-scheme: dark;
  }
  :root[data-glide-theme=light] { --white-key: #fffdf9; --black-key: color-mix(in srgb, var(--fg) 92%, var(--bg)); color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  main { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 18px; padding: 16px 20px 10px; }
  .kicker { font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.1; letter-spacing: -.01em; }
  .grow { flex: 1; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
  .seg button, .act { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--fg); }
  .act { background: var(--accent); color: var(--ink); font-weight: 600; padding: 8px 16px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    border-radius: 999px; padding: 6px 10px; }
  #score { font: 12px/1.2 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  .stage { position: relative; min-height: 120px; }
  #lane { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .keys { position: relative; height: clamp(110px, 24vh, 170px); margin: 0 12px 12px; user-select: none; touch-action: none; }
  .key { position: absolute; top: 0; border-radius: 0 0 8px 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
    font: 600 11px/1 ui-monospace, Menlo, monospace; cursor: pointer; transition: background-color .06s; }
  .key.white { height: 100%; background: var(--white-key); color: color-mix(in srgb, var(--bg) 60%, transparent);
    border: 1px solid color-mix(in srgb, var(--bg) 70%, transparent); z-index: 1; }
  .key.black { height: 62%; background: var(--black-key); color: color-mix(in srgb, var(--fg) 55%, transparent); z-index: 2;
    border: 1px solid color-mix(in srgb, var(--bg) 80%, black); box-shadow: 0 3px 6px rgba(0,0,0,.35); }
  .key[data-target=true] { box-shadow: inset 0 -6px 0 var(--accent); }
  .key[data-down=true] { background: var(--accent); color: var(--ink); }
  .key.black[data-down=true] { background: color-mix(in srgb, var(--accent) 80%, var(--bg)); }
  .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: var(--muted); font-size: 12px; pointer-events: none; }
  @media (max-width: 560px) { header { padding: 12px 12px 8px; } h1 { font-size: 20px; } #score { min-width: 0; } .keys { margin: 0 6px 8px; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="kicker">Glide · Piano</div>
      <h1 id="title">Ode to Joy</h1>
    </div>
    <div class="grow"></div>
    <select id="song" aria-label="Song"></select>
    <div class="seg" role="group" aria-label="Mode">
      <button data-mode="listen" aria-pressed="true">Listen</button>
      <button data-mode="play" aria-pressed="false">Play</button>
      <button data-mode="free" aria-pressed="false">Free</button>
    </div>
    <button class="act" id="start">Start</button>
    <div id="score" aria-live="polite"></div>
  </header>
  <section class="stage">
    <canvas id="lane" role="img" aria-label="Notes falling toward the keys"></canvas>
    <div class="hint" id="hint">Play with A S D F G H J K L ; ' and W E T Y U O P, or tap the keys. Z and X shift the octave.</div>
  </section>
  <div class="keys" id="keys" aria-label="Piano keyboard"></div>
</main>
<script>
(() => {
  'use strict'
  const M = Math
  const LOW = 60, HIGH = 84                     // C4 to C6, 25 keys
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B']
  const BLACK = new Set([1, 3, 6, 8, 10])
  const isBlack = m => BLACK.has(m % 12)
  const nameOf = m => `${NAMES[m % 12]}${M.floor(m / 12) - 1}`
  const mtof = m => 440 * M.pow(2, (m - 69) / 12)

  // ---- Songs: [midi, beat, beats]; `r` is the melody (what Play asks of you), `l` the accompaniment ----------
  const n = (part, list) => list.map(([m, b, d]) => ({ m, b, d, part }))
  const SONGS = [
    { title: 'Ode to Joy', bpm: 108, notes: [
      ...n('r', [[76, 0, 1], [76, 1, 1], [77, 2, 1], [79, 3, 1], [79, 4, 1], [77, 5, 1], [76, 6, 1], [74, 7, 1],
        [72, 8, 1], [72, 9, 1], [74, 10, 1], [76, 11, 1], [76, 12, 1.5], [74, 13.5, 0.5], [74, 14, 2],
        [76, 16, 1], [76, 17, 1], [77, 18, 1], [79, 19, 1], [79, 20, 1], [77, 21, 1], [76, 22, 1], [74, 23, 1],
        [72, 24, 1], [72, 25, 1], [74, 26, 1], [76, 27, 1], [74, 28, 1.5], [72, 29.5, 0.5], [72, 30, 2]]),
      ...n('l', [[60, 0, 2], [64, 2, 2], [67, 4, 2], [62, 6, 2], [60, 8, 2], [64, 10, 2], [67, 12, 2], [62, 14, 2],
        [60, 16, 2], [64, 18, 2], [67, 20, 2], [62, 22, 2], [60, 24, 2], [64, 26, 2], [67, 28, 2], [60, 30, 2]])
    ] },
    { title: 'Twinkle, Twinkle', bpm: 100, notes: [
      ...n('r', [[72, 0, 1], [72, 1, 1], [79, 2, 1], [79, 3, 1], [81, 4, 1], [81, 5, 1], [79, 6, 2],
        [77, 8, 1], [77, 9, 1], [76, 10, 1], [76, 11, 1], [74, 12, 1], [74, 13, 1], [72, 14, 2],
        [79, 16, 1], [79, 17, 1], [77, 18, 1], [77, 19, 1], [76, 20, 1], [76, 21, 1], [74, 22, 2],
        [79, 24, 1], [79, 25, 1], [77, 26, 1], [77, 27, 1], [76, 28, 1], [76, 29, 1], [74, 30, 2],
        [72, 32, 1], [72, 33, 1], [79, 34, 1], [79, 35, 1], [81, 36, 1], [81, 37, 1], [79, 38, 2],
        [77, 40, 1], [77, 41, 1], [76, 42, 1], [76, 43, 1], [74, 44, 1], [74, 45, 1], [72, 46, 2]]),
      ...n('l', [[60, 0, 2], [64, 2, 2], [65, 4, 2], [64, 6, 2], [62, 8, 2], [60, 10, 2], [67, 12, 2], [60, 14, 2],
        [64, 16, 2], [62, 18, 2], [60, 20, 2], [67, 22, 2], [64, 24, 2], [62, 26, 2], [60, 28, 2], [67, 30, 2],
        [60, 32, 2], [64, 34, 2], [65, 36, 2], [64, 38, 2], [62, 40, 2], [60, 42, 2], [67, 44, 2], [60, 46, 2]])
    ] },
    { title: 'Für Elise', bpm: 132, notes: n('r', [
      [76, 0, 0.5], [75, 0.5, 0.5], [76, 1, 0.5], [75, 1.5, 0.5], [76, 2, 0.5], [71, 2.5, 0.5], [74, 3, 0.5], [72, 3.5, 0.5], [69, 4, 1.5],
      [60, 5.5, 0.5], [64, 6, 0.5], [69, 6.5, 0.5], [71, 7, 1.5], [64, 8.5, 0.5], [68, 9, 0.5], [71, 9.5, 0.5], [72, 10, 1.5],
      [64, 11.5, 0.5], [76, 12, 0.5], [75, 12.5, 0.5], [76, 13, 0.5], [75, 13.5, 0.5], [76, 14, 0.5], [71, 14.5, 0.5], [74, 15, 0.5], [72, 15.5, 0.5], [69, 16, 1.5],
      [60, 17.5, 0.5], [64, 18, 0.5], [69, 18.5, 0.5], [71, 19, 1.5], [64, 20.5, 0.5], [72, 21, 0.5], [71, 21.5, 0.5], [69, 22, 2]]) }
  ]
  const LEAD_IN = 2.6        // seconds of notes falling before the first one lands
  const WINDOW = 3           // seconds of song the lane shows
  const timed = s => s.notes.map(x => ({ ...x, t: x.b * 60 / s.bpm, dur: x.d * 60 / s.bpm })).sort((a, b) => a.t - b.t || a.m - b.m)

  // ---- Theme --------------------------------------------------------------------------------------------
  const DEFAULT = { dark: true, bg: '#0e0c14', surface: '#17141f', fg: '#ece8f4', muted: '#9a93ab', accent: '#6ee7c8', accentInk: '#111111' }
  const cssVar = name => { try { return (window.getComputedStyle?.(document.documentElement).getPropertyValue(name) || '').trim() } catch { return '' } }
  let theme = window.__glideTheme || {
    dark: document.documentElement.dataset.glideTheme !== 'light',
    bg: cssVar('--glide-bg') || DEFAULT.bg, surface: cssVar('--glide-surface') || DEFAULT.surface, fg: cssVar('--glide-fg') || DEFAULT.fg,
    muted: cssVar('--glide-muted') || DEFAULT.muted, accent: cssVar('--glide-accent') || DEFAULT.accent, accentInk: cssVar('--glide-accent-ink') || DEFAULT.accentInk
  }
  const rgba = (hex, a) => {
    const v = parseInt(String(hex).replace('#', '').slice(0, 6), 16)
    return Number.isFinite(v) ? `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})` : `rgba(110,231,200,${a})`
  }

  // ---- The piano voice ----------------------------------------------------------------------------------
  let ctx, master, analyser, wave, hammer
  const voices = new Map()   // midi → voice
  function audio() {
    if (ctx) return ctx
    const AC = window.AudioContext || window.webkitAudioContext
    if (!AC) throw new Error('This page needs WebAudio.')
    ctx = new AC()
    master = ctx.createGain()
    master.gain.value = 0.8
    const comp = ctx.createDynamicsCompressor()
    comp.threshold.value = -16
    comp.ratio.value = 4
    analyser = ctx.createAnalyser()
    analyser.fftSize = 2048
    master.connect(comp)
    comp.connect(analyser)
    analyser.connect(ctx.destination)
    // A small room: four feedback delays (a few tens of ms, prime-ish lengths) fed from the master.
    const room = ctx.createGain()
    room.gain.value = 0.16
    master.connect(room)
    for (const [ms, fb] of [[29.7, 0.62], [37.1, 0.6], [41.1, 0.58], [43.7, 0.56]]) {
      const d = ctx.createDelay(0.1), g = ctx.createGain(), damp = ctx.createBiquadFilter()
      d.delayTime.value = ms / 1000
      g.gain.value = fb
      damp.type = 'lowpass'
      damp.frequency.value = 3800
      room.connect(d); d.connect(damp); damp.connect(g); g.connect(d)
      damp.connect(comp)
    }
    // Strings: a fundamental with partials falling away, the way a struck string's do.
    const real = new Float32Array([0, 0, 0, 0, 0, 0, 0, 0, 0])
    const imag = new Float32Array([0, 1, 0.42, 0.24, 0.14, 0.09, 0.05, 0.03, 0.02])
    wave = ctx.createPeriodicWave(real, imag)
    // The hammer: 40 ms of seeded noise.
    hammer = ctx.createBuffer(1, M.floor(ctx.sampleRate * 0.04), ctx.sampleRate)
    const h = hammer.getChannelData(0)
    let s = 0x2545f491
    for (let i = 0; i < h.length; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; h[i] = ((s >>> 0) / 4294967296 * 2 - 1) * (1 - i / h.length) }
    return ctx
  }

  function strike(m, velocity = 0.9) {
    audio()
    if (ctx.state === 'suspended') void ctx.resume()
    release(m, 0.02)
    const t = ctx.currentTime, f = mtof(m)
    const peak = 0.22 * velocity
    const decay = 2.4 * M.pow(0.5, (m - 60) / 24)    // low strings ring longer
    const vca = ctx.createGain()
    vca.gain.setValueAtTime(0, t)
    vca.gain.linearRampToValueAtTime(peak, t + 0.004)
    vca.gain.setTargetAtTime(peak * 0.45, t + 0.004, 0.09)
    vca.gain.setTargetAtTime(0.0001, t + 0.25, decay)
    const tone = ctx.createBiquadFilter()
    tone.type = 'lowpass'
    tone.frequency.setValueAtTime(M.min(16000, f * 9), t)
    tone.frequency.setTargetAtTime(M.min(9000, f * 3), t + 0.01, 0.4)
    const osc = ctx.createOscillator()
    osc.setPeriodicWave(wave)
    osc.frequency.value = f
    const shimmer = ctx.createOscillator(), sg = ctx.createGain()
    shimmer.type = 'sine'
    shimmer.frequency.value = f * 2.003
    sg.gain.value = 0.12
    const ham = ctx.createBufferSource(), hg = ctx.createGain(), hf = ctx.createBiquadFilter()
    ham.buffer = hammer
    hf.type = 'bandpass'
    hf.frequency.value = M.min(6000, f * 4)
    hg.gain.value = 0.05 * velocity
    osc.connect(tone); shimmer.connect(sg); sg.connect(tone); tone.connect(vca)
    ham.connect(hf); hf.connect(hg); hg.connect(vca)
    vca.connect(master)
    osc.start(t); shimmer.start(t); ham.start(t)
    const v = { m, vca, nodes: [osc, shimmer, ham], gains: [vca, sg, hg, tone, hf], at: t }
    voices.set(m, v)
    if (voices.size > 24) release(voices.keys().next().value, 0.03)
    return v
  }

  function release(m, tau = 0.09) {
    const v = voices.get(m)
    if (!v || !ctx) return
    voices.delete(m)
    const t = ctx.currentTime, p = v.vca.gain
    if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t)
    else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t) }
    p.setTargetAtTime(0, t, tau)
    for (const node of v.nodes) { try { node.stop(t + tau * 8 + 0.05) } catch { /* already stopped */ } }
    setTimeout(() => { for (const node of [...v.nodes, ...v.gains]) node.disconnect() }, (tau * 8 + 0.2) * 1000)
  }

  // ---- Keyboard -----------------------------------------------------------------------------------------
  const $ = id => document.getElementById(id)
  const ui = { title: $('title'), song: $('song'), start: $('start'), score: $('score'), lane: $('lane'), keys: $('keys'), hint: $('hint') }
  const WHITES = []
  for (let m = LOW; m <= HIGH; m++) if (!isBlack(m)) WHITES.push(m)
  /** Where a key sits across the keyboard, as fractions of its width (the lane uses the same numbers). */
  const span = m => {
    const ww = 1 / WHITES.length
    if (!isBlack(m)) { const i = WHITES.indexOf(m); return { x: i * ww, w: ww } }
    const i = WHITES.indexOf(m - 1)
    return { x: (i + 1) * ww - ww * 0.31, w: ww * 0.62 }
  }
  const CODES = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY', 'KeyH', 'KeyU', 'KeyJ', 'KeyK', 'KeyO', 'KeyL', 'KeyP', 'Semicolon', 'Quote']
  const LETTERS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';', "'"]
  const KEYCHARS = ['a', 'w', 's', 'e', 'd', 'f', 't', 'g', 'y', 'h', 'u', 'j', 'k', 'o', 'l', 'p', ';', "'"]
  let base = LOW
  const keyEls = new Map()
  for (let m = LOW; m <= HIGH; m++) {
    const el = document.createElement('div')
    const { x, w } = span(m)
    el.className = `key ${isBlack(m) ? 'black' : 'white'}`
    el.dataset.note = String(m)
    el.setAttribute('role', 'button')
    el.setAttribute('aria-label', nameOf(m))
    el.style.left = `${(x * 100).toFixed(3)}%`
    el.style.width = `${(w * 100).toFixed(3)}%`
    keyEls.set(m, el)
    ui.keys.appendChild(el)
  }
  const labelKeys = () => {
    for (const [m, el] of keyEls) { const i = m - base; el.textContent = i >= 0 && i < LETTERS.length ? LETTERS[i] : '' }
  }

  // ---- State --------------------------------------------------------------------------------------------
  let songIndex = 0, notes = timed(SONGS[0])
  let mode = 'listen'          // listen | play | free
  let running = false, time = -LEAD_IN, waiting = false, last = 0
  let hits = 0, slips = 0, streak = 0
  const held = new Set()       // keys down now (from you or the song)
  const ribbons = []           // Free: what you play rises off the keys
  const sparks = []
  const auto = new Set()       // song notes sounding now (index)
  let nextNote = 0             // first note not yet reached

  const reset = () => {
    for (const i of auto) { release(notes[i].m); setKey(notes[i].m, false) }
    auto.clear()
    for (const x of notes) x.done = false
    time = -LEAD_IN; nextNote = 0; waiting = false; hits = 0; slips = 0; streak = 0
    for (const el of keyEls.values()) el.dataset.target = 'false'
  }
  const setKey = (m, down) => { const el = keyEls.get(m); if (el) el.dataset.down = String(down) }

  function press(m, fromSong = false) {
    if (m < LOW || m > HIGH) return
    strike(m, fromSong ? 0.75 : 0.95)
    setKey(m, true)
    if (fromSong) return
    held.add(m)
    if (mode === 'free') ribbons.push({ m, from: performance.now(), to: 0 })
    if (mode === 'play' && running) {
      // A melody note counts from a little before it lands until just after.
      const due = notes.filter(x => x.part === 'r' && !x.done && x.t - time < 0.3 && time - x.t < 0.12)
      const hit = due.find(x => x.m === m)
      if (hit) { hit.done = true; hits++; streak++; spark(m) } else if (waiting) { slips++; streak = 0 }
    }
    paint()
  }
  function lift(m, fromSong = false) {
    if (!fromSong) { held.delete(m); const r = ribbons.findLast?.(x => x.m === m && !x.to); if (r) r.to = performance.now() }
    if (!fromSong && [...auto].some(i => notes[i].m === m)) return
    release(m)
    if (!held.has(m)) setKey(m, false)
  }
  const spark = m => { const { x, w } = span(m); for (let i = 0; i < 10; i++) sparks.push({ x: x + w / 2, vx: (M.random() - 0.5) * 0.25, vy: 120 + M.random() * 160, life: 1 }) }

  function setMode(next) {
    mode = next
    for (const b of document.querySelectorAll('[data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode))
    stop()
    ui.start.style.display = mode === 'free' ? 'none' : ''
    ui.hint.style.display = mode === 'free' || !running ? '' : 'none'
    paint()
  }
  function setSong(i) {
    stop()
    songIndex = (i + SONGS.length) % SONGS.length
    notes = timed(SONGS[songIndex])
    ui.song.value = String(songIndex)
    reset()
    paint()
  }
  function start() {
    if (mode === 'free') return
    audio()
    if (ctx.state === 'suspended') void ctx.resume()
    reset()
    // Play puts the letters where the melody is: A on C5 when it never goes below it.
    if (mode === 'play') base = M.min(...notes.filter(x => x.part === 'r').map(x => x.m)) >= LOW + 12 ? LOW + 12 : LOW
    running = true
    ui.hint.style.display = 'none'
    paint()
  }
  function stop() {
    running = false
    for (const i of auto) { release(notes[i].m); setKey(notes[i].m, false) }
    auto.clear()
    waiting = false
    for (const el of keyEls.values()) el.dataset.target = 'false'
    paint()
  }

  /** Moves the song on by dt seconds: Listen plays each note as it lands; Play waits at a melody note until you hit it. */
  function step(dt) {
    if (!running) return
    const end = notes.length ? M.max(...notes.map(x => x.t + x.dur)) : 0
    if (mode === 'play') {
      const due = notes.filter(x => x.part === 'r' && !x.done && x.t <= time + dt)
      if (due.length) {
        const at = due[0].t
        time = M.max(time, at)
        waiting = true
        const want = new Set(notes.filter(x => x.part === 'r' && !x.done && M.abs(x.t - at) < 0.02).map(x => x.m))
        for (const [m, el] of keyEls) el.dataset.target = String(want.has(m))
      } else {
        if (waiting) for (const el of keyEls.values()) el.dataset.target = 'false'
        waiting = false
        time += dt
      }
    } else time += dt
    // Song notes that sound by themselves: everything in Listen, the accompaniment in Play.
    while (nextNote < notes.length && notes[nextNote].t <= time) {
      const x = notes[nextNote]
      if (mode === 'listen' || x.part === 'l') { press(x.m, true); auto.add(nextNote); x.done = true; if (mode === 'listen') spark(x.m) }
      nextNote++
    }
    for (const i of [...auto]) {
      const x = notes[i]
      if (time >= x.t + x.dur * 0.95) { auto.delete(i); if (!held.has(x.m)) { release(x.m, 0.12); setKey(x.m, false) } }
    }
    if (time > end + 1.2) {
      if (mode === 'listen') { reset(); time = -1.2 }
      else { running = false; waiting = false; ui.hint.style.display = '' }
      paint()
    }
  }

  function paint() {
    const s = SONGS[songIndex]
    ui.title.textContent = mode === 'free' ? 'Free play' : s.title
    ui.start.textContent = running ? 'Restart' : 'Start'
    const melody = notes.filter(x => x.part === 'r').length
    ui.score.textContent = mode === 'play' ? `${hits}/${melody} hit · streak ${streak}${slips ? ` · ${slips} slips` : ''}`
      : mode === 'listen' && running ? `${nameOfTime(time)}` : ''
    labelKeys()
  }
  const nameOfTime = t => { const s = M.max(0, M.floor(t)); return `${M.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }

  // ---- The lane: notes falling to the keys --------------------------------------------------------------
  const g = ui.lane.getContext ? ui.lane.getContext('2d') : null
  let lw = 0, lh = 0, dpr = 1
  const fit = () => {
    const r = ui.lane.getBoundingClientRect()
    dpr = M.min(2, window.devicePixelRatio || 1)
    lw = M.max(1, M.round(r.width || window.innerWidth || 800))
    lh = M.max(1, M.round(r.height || (window.innerHeight || 600) * 0.55))
    if (ui.lane.width !== lw * dpr) ui.lane.width = lw * dpr
    if (ui.lane.height !== lh * dpr) ui.lane.height = lh * dpr
  }
  const pad = 12
  /** The falling notes on screen now: midi, x, y (top), w, h in lane pixels. */
  function visible() {
    const w = lw - pad * 2, speed = lh / WINDOW, hitY = lh - 2
    const out = []
    if (mode === 'free') return out
    for (const x of notes) {
      const bottom = hitY - (x.t - time) * speed
      const top = bottom - M.max(6, x.dur * speed - 3)
      if (bottom < 0 || top > lh) continue
      const s = span(x.m)
      out.push({ m: x.m, part: x.part, done: !!x.done, x: pad + s.x * w + 2, y: top, w: s.w * w - 4, h: bottom - top })
    }
    return out
  }

  function draw() {
    if (!g) return
    fit()
    g.setTransform(dpr, 0, 0, dpr, 0, 0)
    g.fillStyle = theme.bg
    g.fillRect(0, 0, lw, lh)
    const w = lw - pad * 2
    // Lanes: a faint rule per white key, stronger at each C.
    for (const m of WHITES) {
      const { x } = span(m)
      g.fillStyle = rgba(theme.fg, m % 12 === 0 ? 0.12 : 0.05)
      g.fillRect(pad + x * w, 0, 1, lh)
    }
    for (const nt of visible()) {
      const black = isBlack(nt.m)
      const a = nt.done && mode === 'play' ? 0.35 : nt.part === 'l' ? 0.55 : 0.95
      g.fillStyle = black ? rgba(theme.accent, a * 0.75) : rgba(theme.accent, a)
      g.beginPath()
      if (g.roundRect) g.roundRect(nt.x, nt.y, nt.w, nt.h, M.min(6, nt.w / 3)); else g.rect(nt.x, nt.y, nt.w, nt.h)
      g.fill()
      if (nt.h > 22 && nt.w > 16) {
        g.fillStyle = theme.accentInk
        g.font = '600 10px ui-monospace, Menlo, monospace'
        g.textAlign = 'center'
        g.fillText(nameOf(nt.m), nt.x + nt.w / 2, nt.y + nt.h - 7)
      }
    }
    // Free play: notes you hold rise off the keys.
    const now = performance.now(), rise = lh / WINDOW / 1000
    for (let i = ribbons.length - 1; i >= 0; i--) {
      const r = ribbons[i], s = span(r.m)
      const bottom = lh - (r.to ? (now - r.to) * rise : 0), top = lh - (now - r.from) * rise
      if (bottom < 0) { ribbons.splice(i, 1); continue }
      g.fillStyle = rgba(theme.accent, 0.85)
      g.fillRect(pad + s.x * w + 2, top, s.w * w - 4, M.max(3, bottom - top))
    }
    // The line the notes land on, and sparks where they do.
    g.fillStyle = rgba(theme.accent, 0.9)
    g.fillRect(0, lh - 2, lw, 2)
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]
      p.life -= 0.035
      if (p.life <= 0) { sparks.splice(i, 1); continue }
      g.fillStyle = rgba(theme.fg, p.life * 0.8)
      g.fillRect(pad + (p.x + p.vx * (1 - p.life)) * w, lh - 4 - p.vy * (1 - p.life), 2, 2)
    }
  }

  function frame(now) {
    const dt = last ? M.min(0.1, (now - last) / 1000) : 0
    last = now
    step(dt)
    if (running && mode === 'listen' && M.floor(time) !== M.floor(time - dt)) paint()
    draw()
    window.requestAnimationFrame(frame)
  }

  // ---- Input --------------------------------------------------------------------------------------------
  const noteOfKey = e => {
    let i = CODES.indexOf(e.code)
    if (i < 0) i = KEYCHARS.indexOf(String(e.key || '').toLowerCase())
    return i < 0 ? undefined : base + i
  }
  const down = new Map()   // keyboard code → the note it pressed
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || (e.target && /^(SELECT|INPUT)$/.test(e.target.tagName || ''))) return
    if (e.repeat) return
    const k = String(e.key || '').toLowerCase()
    if (k === 'z' || k === 'x') { base = M.max(LOW, M.min(HIGH - 12, base + (k === 'x' ? 12 : -12))); paint(); return }
    const m = noteOfKey(e)
    if (m === undefined) return
    e.preventDefault?.()
    down.set(e.code || k, m)
    press(m)
  })
  window.addEventListener('keyup', e => {
    const id = e.code || String(e.key || '').toLowerCase()
    const m = down.get(id)
    if (m === undefined) return
    down.delete(id)
    lift(m)
  })
  window.addEventListener('blur', () => { for (const m of down.values()) lift(m); down.clear() })
  ui.keys.addEventListener('pointerdown', e => {
    const m = Number(e.target?.dataset?.note)
    if (!Number.isFinite(m)) return
    e.target.setPointerCapture?.(e.pointerId)
    down.set(`pointer${e.pointerId}`, m)
    press(m)
  })
  const up = e => { const m = down.get(`pointer${e.pointerId}`); if (m === undefined) return; down.delete(`pointer${e.pointerId}`); lift(m) }
  ui.keys.addEventListener('pointerup', up)
  ui.keys.addEventListener('pointercancel', up)
  ui.start.addEventListener('click', () => start())
  for (const b of document.querySelectorAll('[data-mode]')) b.addEventListener('click', () => setMode(b.dataset.mode))
  SONGS.forEach((s, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = s.title; ui.song.appendChild(o) })
  ui.song.addEventListener('change', () => setSong(Number(ui.song.value)))
  window.addEventListener('glide-theme', e => { theme = { ...DEFAULT, ...(e.detail || {}) }; draw() })
  window.addEventListener('resize', () => draw())

  paint()
  window.requestAnimationFrame(frame)

  // What a test (or an agent driving the page) reads and drives.
  window.piano = {
    songs: SONGS.map(s => s.title),
    get mode() { return mode }, get running() { return running }, get waiting() { return waiting }, get time() { return time },
    get score() { return { hits, slips, streak, melody: notes.filter(x => x.part === 'r').length } },
    get theme() { return theme }, get analyser() { return analyser }, get sounding() { return [...voices.keys()] },
    get ribbons() { return ribbons.length },
    notes: visible, first: () => ({ ...notes[0] }), span, nameOf,
    setMode, setSong, start, stop, press: m => press(m), lift: m => lift(m)
  }
})()
</script>
</body>
</html>
