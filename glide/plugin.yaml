name: glide
label: Glide
version: 0.1.0
manifest_version: 2
kind: standalone
description: "Stop repeating yourself: /glide quotes the corrections you gave before into new turns, from z0intelligence's unified memory when installed, else from a local store of your past sessions. Opt-in, local, no model calls."
author: "Kevin Rajan"
license: MIT
homepage: https://github.com/kvnloo/glide
tags: [memory, corrections, local]
requires_hermes: ">=0.22.2"
provides_tools: [glide_ui_mount, glide_ui_unmount, glide_ui_style]
provides_hooks: [pre_llm_call]
