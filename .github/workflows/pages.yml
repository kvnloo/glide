name: Glide Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'glide/site/**'
      - 'glide/frontend/tokens.ts'
      - 'glide/themes/shared/glide.json'
      - 'glide/tools/site_tokens.py'
      - 'glide/tools/check_privacy.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glide-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage and scan the static site
        run: |
          python3 glide/tools/site_tokens.py --check
          mkdir "$RUNNER_TEMP/glide-pages"
          install -m 644 glide/site/{index.html,app.js,model.js,style.css,tokens.css} "$RUNNER_TEMP/glide-pages/"
          python3 glide/tools/check_privacy.py --directory "$RUNNER_TEMP/glide-pages"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/glide-pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
