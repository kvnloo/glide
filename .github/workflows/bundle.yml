# Builds frontend/dist/entry.js on main and commits it, so an install (a plain git clone) runs the
# current frontend with no build step, and pull requests carry only source. The `checks` workflow
# fails a pull request that changes the bundle itself.
name: bundle

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/dist/**'
      - '.github/workflows/bundle.yml'
      - 'scripts/bundle_provenance.py'
  workflow_dispatch:

permissions:
  contents: read

# Each run builds its checked-out revision; superseded runs must not publish.
concurrency:
  group: bundle
  cancel-in-progress: false

jobs:
  bundle:
    name: build and commit dist/entry.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      HERMES_SRC: ${{ github.workspace }}/.hermes-agent
      OPENUI_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # A deploy key may push past main's ruleset (it requires pull requests); the token may not.
          ssh-key: ${{ secrets.BUNDLE_DEPLOY_KEY }}
      - id: lock
        run: |
          sha=$(tr -d '[:space:]' < hermes-src.lock)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=frontend/hermes-src.lock::not a commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.lock.outputs.sha }}
          path: .hermes-agent
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: node scripts/hermes-src.mjs && bun install --frozen-lockfile
      - name: build, commit and push when it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source=$(git rev-parse HEAD)
          python3 ../scripts/bundle_provenance.py verify --plugin .. --hermes "$HERMES_SRC" --expected "$source"
          node scripts/build.mjs
          if git diff --quiet -- dist/entry.js; then
            echo "dist/entry.js is current"
            exit 0
          fi
          git fetch -q origin main
          if [[ $(git rev-parse FETCH_HEAD) != "$source" ]]; then
            echo "::error::main moved; dispatch a fresh bundle build if the newer run did not publish"
            exit 1
          fi
          git add dist/entry.js
          git commit -q -m "chore(frontend): build dist/entry.js for ${source:0:7}"
          # An ordinary push fails closed if main moves after the comparison.
          git push origin HEAD:main
