name: glide
label: Glide
version: 0.2.0
manifest_version: 2
kind: standalone
description: "Glide for Hermes: the Tern chat UI drawn natively by the Tern terminal over its Surface Protocol, plus the Glide memory and attention tools. Adds `hermes tern` and `hermes glide`."
author: "alt-glitch (original), Kevin Rajan (fork)"
license: MIT
homepage: https://github.com/kvnloo/glide
tags: [tern, tui, frontend]
requires_hermes: ">=0.23.0"
provides_tools: [link_pull_request, unlink_pull_request, list_pull_requests]
provides_hooks: [pre_llm_call]
optional_env:
  - name: GITHUB_TOKEN
    description: "GitHub token for the pull request view and its checks (`hermes config set GITHUB_TOKEN <token>`)"
    password: true
  - name: GITHUB_ENTERPRISE_TOKEN
    description: "GitHub Enterprise token, sent only to the hosts in the plugin's enterprise_hosts setting"
    password: true
config_schema:
  enterprise_hosts:
    type: list
    default: []
    label: GitHub Enterprise hosts
    description: "GitHub Enterprise Server hosts (e.g. github.mycompany.com) that tern may read pull requests from and send GITHUB_ENTERPRISE_TOKEN to. github.com is always allowed. Any other host is refused."
