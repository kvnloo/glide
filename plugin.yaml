name: glide
label: Glide
version: 0.2.0
manifest_version: 2
kind: standalone
description: "Glide: an agent workspace for Hermes in Tern. Native cards for focus blocks and digests, opt-in corrections memory, a Socratic council, voice lanes, your fleet and live composer widgets, in Glide's own Tern frontend. Adds `hermes tern` and `hermes glide`."
author: "Kevin Rajan; Tern frontend base by alt-glitch"
license: MIT
homepage: https://github.com/kvnloo/glide
tags: [glide, tern, tui, frontend, memory, attention]
requires_hermes: ">=0.23.0"
provides_tools: [link_pull_request, unlink_pull_request, list_pull_requests, ask_control, glide_skin, glide_ui_mount, glide_ui_unmount, glide_ui_style, glide_page_open, glide_deep_zoom_open, glide_theme]
provides_hooks: [pre_llm_call]
optional_env:
  - name: GITHUB_TOKEN
    description: "GitHub token for the pull request view and its checks (`hermes config set GITHUB_TOKEN <token>`)"
    password: true
  - name: GITHUB_ENTERPRISE_TOKEN
    description: "GitHub Enterprise token, sent only to the hosts in the plugin's enterprise_hosts setting"
    password: true
config_schema:
  enterprise_hosts:
    type: list
    default: []
    label: GitHub Enterprise hosts
    description: "GitHub Enterprise Server hosts (e.g. github.mycompany.com) that tern may read pull requests from and send GITHUB_ENTERPRISE_TOKEN to. github.com is always allowed. Any other host is refused."
  lanes_token_file:
    type: string
    default: ""
    label: Lane broker token file
    description: "Path of the file holding the bearer token for a local lane broker (GLIDE_LANES_URL, loopback only). Empty (the default) reads no token file and shows no lane strip."
